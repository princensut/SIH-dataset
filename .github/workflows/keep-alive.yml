name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render free-tier spin down
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CycloneAI Backend
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL="https://cycloneai-backend.onrender.com"
          fi
          echo "Pinging $BACKEND_URL/ping..."
          curl -fsS -m 20 "$BACKEND_URL/ping" || echo "Ping failed or server is waking up"
