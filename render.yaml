# Render Blueprint — one-click deploy for CycloneAI Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cycloneai-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
    healthCheckPath: /health
    autoDeploy: true

  # ============================================================
  # NOTE: Keep-alive cron on Render requires a paid Starter plan
  # ($1/mo). To keep the backend 100% FREE with NO credit card,
  # the keep-alive ping is handled automatically by the included
  # GitHub Actions workflow in .github/workflows/keep-alive.yml!
  # If you have a paid Render plan, uncomment the block below:
